<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Productivity Prediction{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.min.js" rel="preload" as="script">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-black fixed-top shadow-sm">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" href="{{ url_for('home') }}">
                <i class="bi bi-graph-up-arrow text-primary me-2"></i>
                AI Productivity Prediction
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if active == 'home' %}active text-primary fw-semibold{% endif %}" href="{{ url_for('home') }}">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active == 'descriptive' %}active text-primary fw-semibold{% endif %}" href="{{ url_for('descriptive') }}">Statistics</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active == 'preprocessing' %}active text-primary fw-semibold{% endif %}" href="{{ url_for('preprocessing') }}">Preprocessing</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active == 'association_rules' %}active text-primary fw-semibold{% endif %}" href="{{ url_for('association_rules') }}">Association Rules</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active == 'evaluation' %}active text-primary fw-semibold{% endif %}" href="{{ url_for('evaluation') }}">Evaluation</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active == 'model' %}active text-primary fw-semibold{% endif %}" href="{{ url_for('model') }}">Model</a>
                    </li>
                    
                </ul>
            </div>
        </div>
    </nav>

    <main class="pt-5">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-black text-light py-4 mt-5">
        <div class="container text-center">
            <p class="mb-0 text-white small">&copy; 2026 AI Productivity Prediction Research Project</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
